<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - THPT Điều Cải AI Camera</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components/buttons-redesign.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo">ĐC</div>
                <div>
                    <h1>THPT ĐIỀU CẢI</h1>
                    <p>Hệ thống điểm danh AI Camera</p>
                </div>
            </div>
            <h2>Quên mật khẩu</h2>
            <p class="auth-lead">Nhập email tài khoản. Nếu email tồn tại, hệ thống sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
            <div id="authAlert" class="auth-alert"></div>
            <form id="forgotForm">
                <div class="auth-field">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" required autocomplete="username">
                </div>
                <div class="auth-actions">
                    <button class="btn btn-primary" type="submit">
                        <i class="fa-solid fa-envelope"></i> Gửi hướng dẫn
                    </button>
                </div>
            </form>
            <div class="auth-links">
                <a href="login.html">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/login.js"></script>
</body>
</html>
