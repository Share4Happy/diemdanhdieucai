<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - THPT Điều Cải AI Camera</title>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/components/buttons-redesign.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo">ĐC</div>
                <div>
                    <h1>THPT ĐIỀU CẢI</h1>
                    <p>Hệ thống điểm danh AI Camera</p>
                </div>
            </div>
            <h2>Đặt lại mật khẩu</h2>
            <p class="auth-lead">Nhập mật khẩu mới (tối thiểu 8 ký tự).</p>
            <div id="authAlert" class="auth-alert"></div>
            <form id="resetForm">
                <div class="auth-field">
                    <label for="password">Mật khẩu mới</label>
                    <input class="form-control" type="password" id="password" required minlength="8" autocomplete="new-password">
                </div>
                <div class="auth-field">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input class="form-control" type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
                </div>
                <div class="auth-actions">
                    <button class="btn btn-primary" type="submit">
                        <i class="fa-solid fa-key"></i> Lưu mật khẩu
                    </button>
                </div>
            </form>
            <div class="auth-links">
                <a href="login.html">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
    <script type="module" src="js/login.js"></script>
</body>
</html>
