# =========================================================================
# NGINX CONFIGURATION - HỆ THỐNG ĐIỂM DANH AI THPT ĐIỀU CẢI
# Phục vụ Frontend tĩnh + Reverse Proxy API sang Backend (Không lo CORS)
# =========================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Nén Gzip tối ưu hóa hiệu năng truyền tải mạng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 1. Điều hướng các trang giao diện HTML chuẩn
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Hỗ trợ URL đẹp không cần đuôi .html
    location = /login {
        try_files /login.html =404;
    }
    location = /cameras {
        try_files /cameras.html =404;
    }
    location = /roi-config {
        try_files /roi-config.html =404;
    }
    location = /reports {
        try_files /reports.html =404;
    }
    location = /notifications {
        try_files /notifications.html =404;
    }
    location = /users {
        try_files /users.html =404;
    }
    location = /forgot-password {
        try_files /forgot-password.html =404;
    }
    location = /reset-password {
        try_files /reset-password.html =404;
    }

    # 2. Reverse Proxy cho toàn bộ REST API (/api/...)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Tăng timeout cho tác vụ điểm danh 30 camera và sao lưu đám mây
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }

    # 3. Reverse Proxy cho thư mục dữ liệu tĩnh cần xác thực (/storage/, /dataset/, /camera/)
    location /storage/ {
        proxy_pass http://backend:8000/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 100M;
    }

    location /dataset/ {
        proxy_pass http://backend:8000/dataset/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location /camera/ {
        proxy_pass http://backend:8000/camera/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # 4. Proxy tới Swagger UI & ReDoc API Documentation
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 5. Caching tài nguyên CSS, JS, Image của giao diện
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
