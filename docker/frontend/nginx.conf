# =========================================================================
# NGINX CONFIGURATION - HỆ THỐNG ĐIỂM DANH AI THPT ĐIỀU CẢI
# Phục vụ Frontend tĩnh + Reverse Proxy API sang Backend (Không lo CORS)
# =========================================================================

server {
    listen 80;
    # Tự động đón nhận mọi tên miền hoặc IP máy chủ trỏ về (không cần sửa file này khi đổi domain)
    server_name _ localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Nâng giới hạn tải lên tối đa lên 500MB (hỗ trợ kiểm thử video và tải dataset/sao lưu lớn)
    client_max_body_size 500M;

    # Nén Gzip tối ưu hóa hiệu năng truyền tải mạng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 1. Điều hướng các trang giao diện HTML chuẩn
    location = / {
        if ($cookie_access_token = "") {
            return 302 /login;
        }
        try_files /index.html =404;
    }

    # Hỗ trợ URL đẹp không cần đuôi .html
    location = /login {
        if ($cookie_access_token != "") {
            return 302 /;
        }
        try_files /login.html =404;
    }
    location = /classrooms {
        if ($cookie_access_token = "") {
            return 302 /login?redirect=classrooms.html;
        }
        try_files /classrooms.html =404;
    }
    location = /classes {
        if ($cookie_access_token = "") {
            return 302 /login?redirect=classes.html;
        }
        try_files /classes.html =404;
    }
    location = /cameras {
        if ($cookie_access_token = "") {
            return 302 /login?redirect=cameras.html;
        }
        try_files /cameras.html =404;
    }
    location = /roi-config {
        return 302 /classrooms;
    }
    location = /reports {
        if ($cookie_access_token = "") {
            return 302 /login?redirect=reports.html;
        }
        try_files /reports.html =404;
    }
    location = /notifications {
        if ($cookie_access_token = "") {
            return 302 /login?redirect=notifications.html;
        }
        try_files /notifications.html =404;
    }
    # location = /stream-config {
    #     if ($cookie_access_token = "") {
    #         return 302 /login?redirect=stream-config.html;
    #     }
    #     try_files /stream-config.html =404;
    # }
    location = /settings {
        if ($cookie_access_token = "") {
            return 302 /login?redirect=settings.html;
        }
        try_files /settings.html =404;
    }
    location = /users {
        return 301 /settings;
    }
    # location = /ai-test {
    #     if ($cookie_access_token = "") {
    #         return 302 /login?redirect=ai-test.html;
    #     }
    #     try_files /ai-test.html =404;
    # }
    location = /forgot-password {
        try_files /forgot-password.html =404;
    }
    location = /reset-password {
        try_files /reset-password.html =404;
    }

    # Chặn truy cập trực tiếp các file .html nội bộ nếu chưa đăng nhập
    location ~* ^/(index|classrooms|classes|cameras|reports|notifications|users|settings)\.html$ {
        if ($cookie_access_token = "") {
            return 302 /login;
        }
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cấu hình Cache-Control tối ưu cho tài nguyên tĩnh (CSS, JS, Fonts, Images)
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 2. Reverse Proxy cho toàn bộ REST API (/api/...)
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Tăng timeout cho tác vụ điểm danh 30 camera và sao lưu đám mây
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    # 3. Reverse Proxy cho thư mục dữ liệu tĩnh cần xác thực (/storage/, /dataset/, /camera/)
    location ^~ /storage/ {
        proxy_pass http://backend:8000/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        client_max_body_size 500M;
    }

    location ^~ /dataset/ {
        proxy_pass http://backend:8000/dataset/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location ^~ /camera/ {
        proxy_pass http://backend:8000/camera/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # 4. Proxy tới Swagger UI & ReDoc API Documentation
    location ^~ /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location ^~ /redoc {
        proxy_pass http://backend:8000/redoc;
        proxy_set_header Host $host;
    }
    location ^~ /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 5. Caching tài nguyên CSS, JS (no-cache để client luôn nhận code cập nhật tức thì)
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Caching ảnh tĩnh và fonts
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Trang lỗi tùy biến
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
