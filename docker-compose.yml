# =============================================================================
# HỆ THỐNG ĐIỂM DANH HỌC SINH TỰ ĐỘNG BẰNG AI CAMERA - THPT ĐIỀU CẢI
# Kiến trúc Container tách biệt Frontend (Nginx) & Backend (FastAPI + YOLO AI)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND SERVICE: FastAPI, AI Engine (YOLO26m), RTSP Ingestion, SQLite
  # ---------------------------------------------------------------------------
  backend:
    image: nguyenloc822004/dieucaiai-backend:v2
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: diemdanh_dieucai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
      # Mặc định sử dụng SQLite cục bộ (an toàn, nhẹ, tương thích hoàn toàn backup Google Drive):
      - DATABASE_URL=${DATABASE_URL:-sqlite:///database/attendance.db}
      - JWT_SECRET=${JWT_SECRET:-change-me-diemdanh-dieucai-random-secret-key}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@truongdieucai.edu.vn}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@2025}
      - APP_PUBLIC_URL=https://eyeai.share4happy.com
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000,https://eyeai.share4happy.com,http://eyeai.share4happy.com
      - PYTHONPATH=/app/backend/app:/app
    env_file:
      - .env
    volumes:
      # 1. Mã nguồn Backend thống nhất tập trung trong ./backend (Package backend.app)
      - ./backend:/app/backend
      - ./backend/app/config:/app/config
      - ./backend/app/services:/app/services
      - ./backend/app/database:/app/database
      # 2. Dữ liệu Runtime (CSDL SQLite, Ảnh captures, Trọng số Models) tập trung trong ./data
      - ./data:/app/data
      - ./data/database:/app/database
      - ./data/storage:/app/storage
      - ./data/models:/app/models
      # 3. Tiện ích và dữ liệu phụ trợ
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./data/dataset:/app/dataset
    networks:
      - attendance-network

    # (Tùy chọn) Kích hoạt GPU NVIDIA: Nếu máy chủ có card NVIDIA và đã cài NVIDIA Container Toolkit,
    # hãy bỏ dấu '#' ở khối deploy bên dưới:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # 2. FRONTEND SERVICE: Nginx Alpine phục vụ giao diện tĩnh & Reverse Proxy API
  # ---------------------------------------------------------------------------
  frontend:
    image: nguyenloc822004/dieucaiai-frontend:v2
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: diemdanh_dieucai_frontend
    restart: unless-stopped
    ports:
      # Ánh xạ ra cổng 3000 của máy chủ (truy cập: http://localhost:3000)
      - "3000:80"
    volumes:
      # Giao diện tĩnh (đồng bộ trực tiếp khi cập nhật mã nguồn HTML/CSS/JS)
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - attendance-network

  # ---------------------------------------------------------------------------
  # 3. DATABASE SERVICE (TÙY CHỌN NÂNG CAO): PostgreSQL 16 Alpine
  # Chỉ khởi động khi thêm cờ profile: docker compose --profile postgres up -d
  # Mặc định hệ thống dùng SQLite siêu nhẹ, không cần kích hoạt service này.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: diemdanh_dieucai_postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dieucai_secure_pass_2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  attendance-network:
    name: diemdanh_dieucai_network
    driver: bridge

volumes:
  pgdata:
    name: diemdanh_dieucai_pgdata