# =============================================================================
# HỆ THỐNG ĐIỂM DANH HỌC SINH TỰ ĐỘNG BẰNG AI CAMERA - THPT ĐIỀU CẢI
# Kiến trúc Container tách biệt Frontend (Nginx) & Backend (FastAPI + YOLO AI)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND SERVICE: FastAPI, AI Engine (YOLO26m), RTSP Ingestion, SQLite
  # ---------------------------------------------------------------------------
  backend:
    image: thanhnhat2510/dieu-cai-ai:backend-v1
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: diemdanh_dieucai_backend
    restart: unless-stopped
    ports:
      # Chỉ lắng nghe trên localhost máy chủ, ngăn chặn truy cập thẳng từ Internet bên ngoài:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
      # Mặc định sử dụng SQLite cục bộ (an toàn, nhẹ, tương thích hoàn toàn backup Google Drive):
      - DATABASE_URL=${DATABASE_URL:-sqlite:///database/attendance.db}
      - JWT_SECRET=${JWT_SECRET:-change-me-diemdanh-dieucai-random-secret-key}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@truongdieucai.edu.vn}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - PYTHONPATH=/app/backend/app:/app
      - STUDENT_DETECTION_API_URL=${STUDENT_DETECTION_API_URL:-http://host.docker.internal:8010/api/predict}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      # 1. Mã nguồn Backend thống nhất tập trung trong ./backend (Package backend.app)
      - ./backend:/app/backend
      - ./backend/app/config:/app/config
      - ./backend/app/services:/app/services
      - ./backend/app/database:/app/database
      # 2. Dữ liệu Runtime (CSDL SQLite, Ảnh captures, Trọng số Models) tập trung trong ./data
      - ./data:/app/data
      - ./data/database:/app/database
      - ./data/storage:/app/storage
      - ./data/models:/app/models
      # 3. Tiện ích và dữ liệu phụ trợ
      - ./tests:/app/tests
      - ./logs:/app/logs
      - ./data/dataset:/app/dataset
    networks:
      - attendance-network

  # ---------------------------------------------------------------------------
  # 2. FRONTEND SERVICE: Nginx Alpine phục vụ giao diện tĩnh & Reverse Proxy API
  # ---------------------------------------------------------------------------
  frontend:
    image: thanhnhat2510/dieu-cai-ai:frontend-v1
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: diemdanh_dieucai_frontend
    restart: unless-stopped
    ports:
      # Ánh xạ ra cổng 3000 của máy chủ (truy cập: http://localhost:3000)
      - "3000:80"
    volumes:
      # Giao diện tĩnh (đồng bộ trực tiếp khi cập nhật mã nguồn HTML/CSS/JS)
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - attendance-network

  # ---------------------------------------------------------------------------
  # 3. DATABASE SERVICE (TÙY CHỌN NÂNG CAO): PostgreSQL 16 Alpine
  # Chỉ khởi động khi thêm cờ profile: docker compose --profile postgres up -d
  # Mặc định hệ thống dùng SQLite siêu nhẹ, không cần kích hoạt service này.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: diemdanh_dieucai_postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dieucai_secure_pass_2026}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attendance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ---------------------------------------------------------------------------
  # 4. RTSP MOCK SERVER: MediaMTX & Tự Động Phát 30 Luồng Camera RTSP (Port 8554)
  # [ĐÃ COMMENT THEO YÊU CẦU - DÙNG CAMERA & NVR HIKVISION THẬT]
  # ---------------------------------------------------------------------------
  # rtsp_mock:
  #   image: bluenviron/mediamtx:latest-ffmpeg
  #   container_name: diemdanh_rtsp_mock
  #   restart: unless-stopped
  #   ports:
  #     - "8554:8554"
  #     - "8888:8888"
  #     - "8889:8889"
  #   volumes:
  #     - ./mock_and_experiments/stream_config/docker_mock_stream/mediamtx.yml:/mediamtx.yml:ro
  #     - ./mock_and_experiments/mock_data/samples:/media/samples:ro
  #     - ./mock_and_experiments/mock_data/mock_streams:/media/scenarios
  #     - ./mock_and_experiments/stream_config/docker_mock_stream/entrypoint.sh:/entrypoint.sh:ro
  #   entrypoint: ["/bin/sh", "/entrypoint.sh"]
  #   networks:
  #     - attendance-network


  # ---------------------------------------------------------------------------
  # 5. STUDENT DETECTION AI SERVICE: YOLO + Depth Anything V2 (Port 8010)
  # ---------------------------------------------------------------------------
  student-detection:
    image: thanhnhat2510/dieu-cai-ai:ai-v1
    build:
      context: ./student-detection
      dockerfile: docker/Dockerfile
    container_name: diemdanh_student_detection
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PYTHONUNBUFFERED=1
      - DET_MODEL_PATH=data/models/yolo26m_finetuned_heads.pt
      - DEPTH_CHECKPOINT=depth-anything/Depth-Anything-V2-Small-hf
    volumes:
      - ./data/models:/app/data/models
      - ./student-detection/data/models:/app/data/models
      - ./data/dataset/samples:/app/data/samples
      - ./student-detection/data/samples:/app/data/samples
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - attendance-network

networks:
  attendance-network:
    name: diemdanh_dieucai_network
    driver: bridge

volumes:
  pgdata:
    name: diemdanh_dieucai_pgdata
  huggingface_cache:
    name: diemdanh_dieucai_huggingface_cache